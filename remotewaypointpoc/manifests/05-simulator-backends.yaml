# OpenAI-compatible LLM simulator backends for the remote-waypoint POC.
#
# Adapted from kubernetes-sigs/wg-ai-gateway PR #56 (payload-processor
# simulator). Uses ghcr.io/llm-d/llm-d-inference-sim, which serves the OpenAI
# API over plain HTTP on :8080 (no TLS, no cert needed).
#
# Each Service is labeled `istio.io/use-waypoint: agents-waypoint` so ztunnel
# redirects client traffic to these services through the waypoint. No
# ServiceEntry, AgentgatewayBackend, or Route is required for basic transparent
# L4/L7 traffic through the waypoint — the waypoint forwards to the original
# destination service. (Add an HTTPRoute attached to the Gateway only if you
# want L7 policy such as model-based routing.)
---
# GPT-4 simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt4-backend
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt4-backend
  template:
    metadata:
      labels:
        app: gpt4-backend
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        args:
        - --model
        - gpt-4
        - --port
        - "8080"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
---
# Claude simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-backend
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-backend
  template:
    metadata:
      labels:
        app: claude-backend
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        args:
        - --model
        - claude
        - --port
        - "8080"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
---
# Default/fallback simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-backend
  namespace: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: default-backend
  template:
    metadata:
      labels:
        app: default-backend
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
        args:
        - --model
        - default
        - --port
        - "8080"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
---
# Services (labeled to front through the agentgateway remote waypoint)
apiVersion: v1
kind: Service
metadata:
  name: gpt4-backend
  namespace: agents
  labels:
    istio.io/use-waypoint: agents-waypoint
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: gpt4-backend
---
apiVersion: v1
kind: Service
metadata:
  name: claude-backend
  namespace: agents
  labels:
    istio.io/use-waypoint: agents-waypoint
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: claude-backend
---
apiVersion: v1
kind: Service
metadata:
  name: default-backend
  namespace: agents
  labels:
    istio.io/use-waypoint: agents-waypoint
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: default-backend
