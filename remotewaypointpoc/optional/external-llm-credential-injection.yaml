# =============================================================================
# OPTIONAL: External LLM with credential injection by the waypoint
# =============================================================================
#
# Realistic agentgateway demo (from the official docs:
# https://agentgateway.dev/docs/kubernetes/latest/llm/providers/openai/).
#
# The point: the meshed client sends a plain request with **NO API key**. The
# waypoint (agentgateway) attaches the provider credential from a Secret and
# forwards to the **off-cluster** OpenAI API over TLS. The credential never
# lives in the client — the waypoint injects it. This is a concrete "action
# performed by the waypoint" beyond plain forwarding.
#
#   client ──HTTP (no key)──► ztunnel ──HBONE──► waypoint
#                                                  │ injects Authorization: Bearer <key>
#                                                  │ originates TLS
#                                                  └──────────► api.openai.com:443
#
# Prerequisites:
#   * The base POC is deployed and working (HBONE_WAYPOINT bind confirmed).
#   * The kind node has egress to the public internet (to reach api.openai.com).
#   * A real OpenAI API key (this path calls the real provider).
#
# To use a mock instead of a real key, point the AgentgatewayBackend host at the
# public httpbun mock (see README "External LLM" section) and drop the auth
# policy — but that variant does not exercise credential injection.
# -----------------------------------------------------------------------------
---
# 1) Secret holding the provider API key. Create it from your key instead of
#    committing it:
#      kubectl create secret generic openai-secret -n agents \
#        --from-literal=Authorization="Bearer $OPENAI_API_KEY"
#    This manifest is a placeholder so `kubectl apply -f` works; REPLACE the
#    value or create the secret out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: agents
type: Opaque
stringData:
  Authorization: "Bearer REPLACE_WITH_YOUR_OPENAI_API_KEY"
---
# 2) LLM backend: managed OpenAI provider. The waypoint knows to reach
#    api.openai.com over TLS. policies.auth.secretRef injects the key above as
#    the upstream Authorization header.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agents
spec:
  ai:
    provider:
      openai: {}
  policies:
    auth:
      secretRef:
        name: openai-secret
---
# 3) ServiceEntry makes the off-cluster host known to the ambient mesh and
#    fronts it with the waypoint (use-waypoint label). The client addresses this
#    host in plaintext so the waypoint can see/modify L7 and inject the key.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: openai
  namespace: agents
  labels:
    istio.io/use-waypoint: agents-waypoint
spec:
  hosts:
  - api.openai.com
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
  - name: http
    number: 80
    protocol: HTTP
    targetPort: 443
---
# 4) Route the fronted ServiceEntry to the LLM backend on the waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openai
  namespace: agents
spec:
  parentRefs:
  - group: networking.istio.io
    kind: ServiceEntry
    name: openai
  rules:
  - backendRefs:
    - name: openai
      group: agentgateway.dev
      kind: AgentgatewayBackend
